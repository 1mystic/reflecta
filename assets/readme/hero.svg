<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reflecta-hero-title reflecta-hero-desc">
  <title id="reflecta-hero-title">Reflecta — a reflective learning intelligence layer</title>
  <desc id="reflecta-hero-desc">A quiz that reads how you answer and reflects back your goal readiness, shown here at 75 percent on the product's own readiness ring.</desc>

  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="0%" r="110%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#B17A50" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="320" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#B17A50" stroke-opacity="0.16"/>

  <!-- left: identity + promise -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- badge -->
    <g transform="translate(64, 56)">
      <rect width="176" height="28" rx="14" fill="#F0E7D8"/>
      <circle cx="18" cy="14" r="4" fill="#8FAA78"/>
      <text x="32" y="18.5" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9C6A42">REFLECTIVE LEARNING</text>
    </g>

    <!-- wordmark -->
    <text x="62" y="150" font-size="56" font-weight="800" letter-spacing="-0.02em" fill="#3A322A">Reflecta</text>

    <!-- promise -->
    <text x="64" y="188" font-size="18" fill="#3A322A">
      <tspan font-weight="700">A quiz that tells you</tspan>
      <tspan font-weight="700" fill="#B17A50"> more than a score.</tspan>
    </text>
    <text x="64" y="216" font-size="14.5" fill="#6A6152">
      <tspan x="64" dy="0">Reads how you answer, not just what you got wrong —</tspan>
      <tspan x="64" dy="21">memorization vs understanding, calibration, and goal-gap mapping.</tspan>
    </text>

    <!-- byline / mechanism cue -->
    <g transform="translate(64, 258)" font-size="12.5" fill="#8C8677">
      <text x="0" y="0">525k-row IRT · BKT · SAKT research track</text>
      <circle cx="4" cy="21" r="2.5" fill="#B17A50"/>
      <text x="16" y="25">intent → gap mapping</text>
      <circle cx="184" cy="21" r="2.5" fill="#8FAA78"/>
      <text x="196" y="25">free &amp; local by default</text>
    </g>
  </g>

  <!-- right: the product's own readiness ring, not decoration -->
  <g transform="translate(990, 150)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle r="58" fill="none" stroke="#F0E7D8" stroke-width="14"/>
    <circle r="58" fill="none" stroke="#B17A50" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="273.32 364.42" transform="rotate(-90)"/>
    <text x="0" y="9" font-size="30" font-weight="800" fill="#3A322A" text-anchor="middle">75%</text>
    <text x="0" y="92" font-size="11" font-weight="700" letter-spacing="0.5" fill="#8C8677" text-anchor="middle">GOAL READINESS</text>
  </g>
</svg>
